; ESP32 side of the RP2040 + ESP32 board (ST7789 240x240 TFT)
; Each former Arduino IDE sketch is a separate environment:
;   pio run -e st7789_receiver -t upload
[platformio]
default_envs = st7789_receiver

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 9600

[env:st7789_receiver]
build_src_filter = +<st7789_receiver/>
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
    adafruit/Adafruit GFX Library@^1.11.11

[env:lgfx_user_setting]
build_src_filter = +<lgfx_user_setting/>
lib_deps = lovyan03/LovyanGFX@^1.1.16

[env:lgfx_moving_circles]
build_src_filter = +<lgfx_moving_circles/>
lib_deps = lovyan03/LovyanGFX@^1.1.16

[env:lgfx_moving_icons]
build_src_filter = +<lgfx_moving_icons/>
lib_deps = lovyan03/LovyanGFX@^1.1.16

[env:uart_link_test]
build_src_filter = +<uart_link_test/>
