; RP2040 side of the RP2040 + ESP32 board
; Arduino-Pico core (earlephilhower). Each program is a separate environment:
;   pio run -e uart_sender -t upload
; First upload: hold BOOTSEL while plugging in USB.
[platformio]
default_envs = uart_sender

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200

[env:uart_sender]
build_src_filter = +<uart_sender/>

[env:sd_card_logger]
build_src_filter = +<sd_card_logger/>
build_flags = -DUSE_BLOCK_DEVICE_INTERFACE=1

[env:sd_card_test]
build_src_filter = +<sd_card_test/>
build_flags = -DUSE_BLOCK_DEVICE_INTERFACE=1

[env:uart_link_test]
build_src_filter = +<uart_link_test/>

[env:gp8_toggle_test]
build_src_filter = +<gp8_toggle_test/>
